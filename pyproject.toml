[project]
name = "ex-ukg-wfm"
dynamic = ["version"]
readme = "README.md"
requires-python = "~=3.14.0"
dependencies = [
    "keboola-component>=1.10.0",
    "keboola-utils>=1.1.0",
    "pydantic>=2.11.7",
    "backoff>=2.2.1",
    "dateparser>=1.2.0",
    "requests>=2.32.0",
]

[dependency-groups]
dev = [
    "freezegun>=1.5.1",
    "keboola.datadirtest>=2.2.0",
    # Pin vcrpy: keboola.vcr 0.5.0 monkeypatches VCRHTTPResponse.__init__ with a one-positional-arg
    # signature matching vcrpy 8.1.x. vcrpy 8.2+ added a second positional (`uri`) to that call, so
    # the patch raises `TypeError: takes 2 positional args but 3 given` at record/replay. This is a
    # keboola.vcr-vs-vcrpy version mismatch (NOT a Python 3.14 issue — plain vcrpy 8.3 runs fine on
    # 3.14). 8.1.1 is within keboola.vcr's own declared range (>=8.1.1,<9). Revisit when keboola.vcr
    # ships a patch compatible with the newer vcrpy signature.
    "vcrpy==8.1.1",
    "mock>=5.2.0",
    "pre-commit>=4.5.0",
    "pytest>=9.0.2",
    "ruff>=0.15.2",
    "ty>=0.0.24",
    "requests-mock>=1.12.1",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = [
    "I",   # isort – import sorting
    "UP",  # pyupgrade – modern Python syntax
    "G",   # flake8-logging-format – no f-strings / str.format in logging calls
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ty.environment]
extra-paths = ["src"]
