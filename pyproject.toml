[project]
name = "ex-ukg-wfm"
dynamic = ["version"]
readme = "README.md"
requires-python = "~=3.14.0"
dependencies = [
    "keboola-component>=1.10.0",
    "keboola-utils>=1.1.0",
    "pydantic>=2.11.7",
    "backoff>=2.2.1",
    "dateparser>=1.2.0",
    "requests>=2.32.0",
]

[dependency-groups]
dev = [
    "freezegun>=1.5.1",
    "keboola.datadirtest>=2.2.0",
    "mock>=5.2.0",
    "pre-commit>=4.5.0",
    "pytest>=9.0.2",
    "ruff>=0.15.2",
    "ty>=0.0.24",
    "requests-mock>=1.12.1",
    "vcrpy>=6.0.1",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = [
    "I",   # isort – import sorting
    "UP",  # pyupgrade – modern Python syntax
    "G",   # flake8-logging-format – no f-strings / str.format in logging calls
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ty.environment]
extra-paths = ["src"]
